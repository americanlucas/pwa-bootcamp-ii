name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4

      - name: SETUP NODE
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: INSTALL DEPENDENCIES ROOT
        run: npm install || echo "No root dependencies"

      - name: INSTALL DEPENDENCIES WEB
        working-directory: apps/web
        run: npm install

      - name: INSTALL DEPENDENCIES API
        working-directory: apps/api
        run: npm install

      - name: BUILD WEB
        working-directory: apps/web
        run: npm run build

      - name: SETUP DOCKER BUILDX
        uses: docker/setup-buildx-action@v3

      - name: BUILD DOCKER IMAGES
        run: docker compose build

      - name: START SERVICES
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
          sleep 45

      - name: CHECK CONTAINERS STATUS
        run: docker ps -a

      - name: CHECK API LOGS
        run: docker logs productivity-api

      - name: HEALTH CHECK API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/api/health; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i/30: API not ready yet, waiting..."
            sleep 5
          done
          curl -f http://localhost:3000/api/health || exit 1

      - name: HEALTH CHECK WEB
        run: curl -f http://localhost:8080 || exit 1

      - name: INSTALL PLAYWRIGHT
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: RUN E2E TESTS
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
        continue-on-error: true

      - name: UPLOAD PLAYWRIGHT REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: UPLOAD TEST RESULTS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: SHOW DOCKER LOGS ON FAILURE
        if: failure()
        run: |
          echo "=== API LOGS ==="
          docker logs productivity-api
          echo "=== WEB LOGS ==="
          docker logs productivity-web

      - name: STOP SERVICES
        if: always()
        run: docker compose down

      - name: UPLOAD BUILD ARTIFACTS
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4

      - name: DOWNLOAD BUILD
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: SETUP NODE
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: START SERVICES
        run: |
          docker compose up -d
          sleep 30

      - name: INSTALL LIGHTHOUSE
        run: npm install -g @lhci/cli

      - name: RUN LIGHTHOUSE CI
        run: lhci autorun --config=lighthouserc.json || echo "Lighthouse completed with warnings"
        continue-on-error: true

      - name: UPLOAD LIGHTHOUSE REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7

      - name: STOP SERVICES
        if: always()
        run: docker compose down

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && success()

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4

      - name: DOWNLOAD BUILD
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: SETUP PAGES
        uses: actions/configure-pages@v5

      - name: UPLOAD PAGES ARTIFACT
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: DEPLOY TO GITHUB PAGES
        id: deployment
        uses: actions/deploy-pages@v4