services:
  # BACKEND API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: productivity-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=*
    volumes:
      - ./apps/api/src:/app/src
      - api-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10           # Aumentado de 3 para 10
      start_period: 90s     # Aumentado de 60s para 90s
    networks:
      - productivity-network